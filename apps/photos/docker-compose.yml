services:
  photos:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    user: 0:0
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    environment:
      WIZARD_APP: photos
      APP_VERSION: 0.5.2
      FRONT_PORT: "8080"
      UPSTREAM_HOST: photos-server
      UPSTREAM_PORT: "2283"
      APP_PORT: ${APP_PORT}
      STATE_DIR: /state
      IMPORT_DIR: /import
      LIBRARY_DIR: /library
      PYTHONDONTWRITEBYTECODE: "1"
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_OWNER_LOGINS: ${WIZARD_OWNER_LOGINS:-}
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/volumes/photos-state:/state
      - ${ROOT_FOLDER_HOST}/media/Photos/Import:/import
      - ${ROOT_FOLDER_HOST}/media/Photos/Library:/library:ro
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      - photos-server
    command:
      - python
      - -c
      - |
        """Wizard MCP front (compressed; source: mcp/front.py + mcp/tools.py, packed by mcp/inline.py)."""
        import base64, zlib
        exec(compile(zlib.decompress(base64.b64decode("")), "front.py", "exec"))
    x-runtipi:
      is_main: true
      internal_port: 8080
    init: true
    ports:
      - 127.0.0.1:${APP_PORT}:8080
  photos-server:
    image: ghcr.io/immich-app/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    mem_limit: 6g
    environment:
      TZ: ${TZ:-UTC}
      DB_HOSTNAME: photos-db
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /secrets/db-password
      REDIS_HOSTNAME: photos-redis
      IMMICH_MACHINE_LEARNING_URL: http://photos-ml:3003
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${ROOT_FOLDER_HOST}/media/Photos/Library:/data
      - ${APP_DATA_DIR}/volumes/photos-secrets:/secrets:ro
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      - photos-db
      - photos-redis
    healthcheck:
      test:
        - CMD-SHELL
        - immich-healthcheck
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  photos-ml:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    mem_limit: 6g
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/volumes/photos-model-cache:/cache
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    healthcheck:
      test:
        - CMD-SHELL
        - python3 healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  photos-redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    environment:
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
  photos-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 4g
    shm_size: 128mb
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_PASSWORD_FILE: /secrets/db-password
      POSTGRES_INITDB_ARGS: --data-checksums
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /secrets/db-password ]; then
          umask 077
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/db-password.tmp
          mv /secrets/db-password.tmp /secrets/db-password
        fi
        chown 0:999 /secrets/db-password && chmod 0640 /secrets/db-password
        exec /usr/local/bin/immich-docker-entrypoint.sh "$$@"
      - photos-db
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - ${APP_DATA_DIR}/volumes/photos-db:/var/lib/postgresql/data
      - ${APP_DATA_DIR}/volumes/photos-secrets:/secrets
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    healthcheck:
      test:
        - CMD-SHELL
        - /usr/local/bin/healthcheck.sh
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
x-runtipi:
  schema_version: 2
  overrides: []
