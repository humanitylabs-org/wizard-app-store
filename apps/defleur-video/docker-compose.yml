services:
  defleur-video:
    image: ghcr.io/humanitylabs-org/defleur-video:0.6.0-testing
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Generous ceilings (see RELEASE.md for the measured 3-minute 1080p peak); no CPU cap.
    pids_limit: 2048
    mem_limit: 10g
    memswap_limit: 10g
    shm_size: 1g
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    environment:
      VIDEO_DATA_DIR: /data
      VIDEO_BIND: 0.0.0.0
      TRANSCRIBER_URL: ${TRANSCRIBER_URL}
      BROWSER_URL: ${BROWSER_URL}
      TRANSCRIBER_MODEL: ${TRANSCRIBER_MODEL}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      is_main: true
      internal_port: 8787
x-runtipi:
  schema_version: 2
  overrides: []
