services:
  defleur-video:
    image: ghcr.io/humanitylabs-org/defleur-video-app:0.7.2
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 2048
    mem_limit: 10g
    memswap_limit: 10g
    shm_size: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    environment:
      VIDEO_DATA_DIR: /data
      VIDEO_BIND: 0.0.0.0
      TRANSCRIBER_URL: ${TRANSCRIBER_URL}
      BROWSER_URL: ${BROWSER_URL}
      TRANSCRIBER_MODEL: ${TRANSCRIBER_MODEL}
      VIDEO_MEDIA_DIR: /media
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${ROOT_FOLDER_HOST}/media:/media
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    x-runtipi:
      is_main: true
      internal_port: 8787
    ports:
      - 127.0.0.1:${APP_PORT}:8787
x-runtipi:
  schema_version: 2
  overrides: []
