services:
  secret-drop:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    environment:
      WIZARD_APP: secret-drop
      APP_VERSION: 0.1.1
      FRONT_PORT: "8792"
      UPSTREAM_HOST: secret-drop-engine
      UPSTREAM_PORT: "8792"
      PYTHONDONTWRITEBYTECODE: "1"
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    depends_on:
      - secret-drop-engine
    command:
      - python
      - -c
      - |
        """Wizard MCP front: serves this app's MCP tools at /mcp and passes every other request,
        byte for byte, to the app behind it (HTTP, streaming and WebSockets alike).
        Stdlib only, so it runs on a stock python image with no build step.
        Generated from the app repo's mcp/ folder; edit there, then run mcp/inline.py."""
        import asyncio
        import contextvars
        import base64
        import json
        import os
        import socket
        import struct
        import time
        import urllib.parse
        import urllib.request
        import uuid

        APP = os.environ.get("WIZARD_APP", "app")
        VERSION = os.environ.get("APP_VERSION", "0")
        PORT = int(os.environ.get("FRONT_PORT", "8080"))
        UP_HOST = os.environ.get("UPSTREAM_HOST", "")
        UP_PORT = int(os.environ.get("UPSTREAM_PORT", str(PORT)))
        MCP_PATH = "/mcp"
        MCP_TOKEN = os.environ.get("MCP_TOKEN", "")  # when set, /mcp needs Authorization: Bearer <token>
        MAX_HEAD = 65536
        MAX_BODY = 1 << 20
        TOOLS = {}
        REQUEST = contextvars.ContextVar("request", default={})  # headers of the current /mcp call


        def tool(name, description, props=None, required=()):
            def deco(fn):
                schema = {"type": "object", "properties": props or {}, "required": list(required)}
                TOOLS[name] = ({"name": name, "description": description, "inputSchema": schema}, fn)
                return fn
            return deco


        def up_addr():
            try:
                return socket.gethostbyname(UP_HOST)
            except OSError:
                return UP_HOST


        def http(method, path, body=None, headers=None, timeout=60):
            url = "http://%s:%d%s" % (up_addr(), UP_PORT, path)
            req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
            with urllib.request.urlopen(req, timeout=timeout) as r:
                return r.status, r.read()


        def err(i, code, message):
            return {"jsonrpc": "2.0", "id": i, "error": {"code": code, "message": message}}


        def rpc(msg):
            m, i, p = msg.get("method"), msg.get("id"), msg.get("params") or {}
            if m == "initialize":
                r = {"protocolVersion": p.get("protocolVersion", "2025-06-18"), "capabilities": {"tools": {}},
                     "serverInfo": {"name": APP, "version": VERSION}}
            elif m == "tools/list":
                r = {"tools": [t[0] for t in TOOLS.values()]}
            elif m == "tools/call":
                name, args = p.get("name"), p.get("arguments") or {}
                if name not in TOOLS:
                    return err(i, -32602, "unknown tool %s" % name)
                try:
                    out = TOOLS[name][1](**args)
                    if isinstance(out, dict) and "_content" in out:
                        r = {"content": out["_content"]}
                    else:
                        text = out if isinstance(out, str) else json.dumps(out, indent=2)
                        r = {"content": [{"type": "text", "text": text[:200000]}]}
                except Exception as e:  # tool errors go back to the agent, not the transport
                    r = {"content": [{"type": "text", "text": "%s: %s" % (type(e).__name__, e)}], "isError": True}
            elif m == "ping":
                r = {}
            elif i is None:
                return None  # notification
            else:
                return err(i, -32601, "unknown method %s" % m)
            return {"jsonrpc": "2.0", "id": i, "result": r}


        REASONS = {200: "OK", 202: "Accepted", 400: "Bad Request", 404: "Not Found", 405: "Method Not Allowed",
                   401: "Unauthorized", 413: "Payload Too Large", 502: "Bad Gateway"}


        async def respond(writer, code, obj=None, extra=""):
            body = b"" if obj is None else json.dumps(obj).encode()
            head = "HTTP/1.1 %d %s\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n%s\r\n" % (
                code, REASONS.get(code, "OK"), len(body), extra)
            writer.write(head.encode() + body)
            try:
                await writer.drain()
            finally:
                writer.close()


        async def mcp(reader, writer, method, rest):
            headers = {}
            for line in rest.decode("latin-1").split("\r\n"):
                if ":" in line:
                    k, v = line.split(":", 1)
                    headers[k.strip().lower()] = v.strip()
            if MCP_TOKEN:
                import hmac
                if not hmac.compare_digest(headers.get("authorization", "").encode(), ("Bearer " + MCP_TOKEN).encode()):
                    return await respond(writer, 401, {"error": "this MCP needs Authorization: Bearer <token>"}, 'WWW-Authenticate: Bearer\r\n')
            if method != "POST":
                return await respond(writer, 405, {"error": "use POST %s" % MCP_PATH}, "Allow: POST\r\n")
            n = int(headers.get("content-length") or 0)
            if n > MAX_BODY:
                return await respond(writer, 413, {"error": "request too large"})
            body = await reader.readexactly(n) if n else b""
            try:
                msg = json.loads(body or b"{}")
            except ValueError:
                return await respond(writer, 400, err(None, -32700, "parse error"))
            REQUEST.set(headers)
            batch = msg if isinstance(msg, list) else [msg]
            results = await asyncio.gather(*(asyncio.to_thread(rpc, x) for x in batch if isinstance(x, dict)))
            out = [x for x in results if x]
            if not out:
                return await respond(writer, 202)
            await respond(writer, 200, out if isinstance(msg, list) else out[0])


        async def pipe(r, w):
            try:
                while True:
                    data = await r.read(65536)
                    if not data:
                        break
                    w.write(data)
                    await w.drain()
            except (ConnectionError, OSError):
                pass
            finally:
                try:
                    w.close()
                except Exception:
                    pass


        async def handle(reader, writer):
            try:
                head = await reader.readuntil(b"\r\n\r\n")
            except (asyncio.IncompleteReadError, asyncio.LimitOverrunError, ConnectionError):
                writer.close()
                return
            line, _, rest = head.partition(b"\r\n")
            parts = line.decode("latin-1").split(" ")
            path = parts[1].split("?", 1)[0] if len(parts) >= 3 else ""
            if path == MCP_PATH:
                return await mcp(reader, writer, parts[0], rest)
            if not UP_HOST:
                return await respond(writer, 404, {"error": "not found"})
            try:
                ur, uw = await asyncio.open_connection(UP_HOST, UP_PORT)
            except OSError:
                return await respond(writer, 502, {"error": "%s is starting or not reachable" % APP})
            # One request per proxied connection (unless it is an upgrade such as a WebSocket), so a
            # later /mcp request can never ride an upstream keep-alive connection.
            lines = head.decode("latin-1").split("\r\n")
            if not any(l.lower().startswith("upgrade:") for l in lines):
                lines = [l for l in lines if l and not l.lower().startswith(("connection:", "keep-alive:"))]
                head = ("\r\n".join(lines) + "\r\nConnection: close\r\n\r\n").encode("latin-1")
            uw.write(head)
            await uw.drain()
            await asyncio.gather(pipe(reader, uw), pipe(ur, writer))


        async def main():
            srv = await asyncio.start_server(handle, "0.0.0.0", PORT, limit=MAX_HEAD)
            async with srv:
                await srv.serve_forever()


        # ---- tools for this app ----
        # The MCP never sees a secret: it creates the request with the agent's PUBLIC key and reports status.
        # Pickup and decryption stay in the agent's own client (GET /client.py), so plaintext only ever
        # exists on the agent's side. That is the whole point of Secret Drop.


        def _relay(method, path, payload=None, pickup=None):
            headers = {"Content-Type": "application/json"}
            host = REQUEST.get().get("host")
            if host:
                headers["Host"] = host  # links point at the address the caller used (unless SECRET_DROP_PUBLIC_URL is set)
            auth = REQUEST.get().get("authorization")
            if auth:
                headers["Authorization"] = auth  # the relay's own token, forwarded unchanged
            if pickup:
                headers["X-Secret-Drop-Pickup"] = str(pickup)
            body = None if payload is None else json.dumps(payload).encode()
            url = "http://%s:%d%s" % (up_addr(), UP_PORT, path)
            req = urllib.request.Request(url, data=body, method=method, headers=headers)
            try:
                with urllib.request.urlopen(req, timeout=30) as r:
                    return json.loads(r.read() or b"{}")
            except urllib.error.HTTPError as e:
                raise RuntimeError("relay %d: %s" % (e.code, e.read()[:400].decode("utf-8", "replace")))


        @tool("secret_drop_info", "Relay version, limits, and where to download the client that decrypts pickups locally.")
        def secret_drop_info():
            d = _relay("GET", "/api/v1/info")
            d["client"] = "GET /client.py on this app's address (check its sha256 against client_sha256)"
            d["skill"] = "GET /SKILL.md on this app's address"
            return d


        @tool("request_secret", "Create a one-time link the human opens to type a credential. It is encrypted to your public key; "
              "send the human the full request_url and keep pickup_secret private. Decrypt with the Secret Drop client, never here.",
              {"key": {"type": "string", "description": "Env var to fill, uppercase, ending in _API_KEY, _TOKEN, _SECRET, _PASSWORD, _PASS, _URL, _URI or _CREDENTIAL"},
               "label": {"type": "string", "description": "What the human is asked for, e.g. 'OpenAI API key'"},
               "requester": {"type": "string", "description": "How you are shown to the human, e.g. 'Hermes on demobox'"},
               "public_key": {"type": "string", "description": "Your X25519 public key, base64url (from the client's keygen)"},
               "ttl_minutes": {"type": "integer", "description": "5 to 300, default 120"}},
              ["key", "label", "requester", "public_key"])
        def request_secret(key, label, requester, public_key, ttl_minutes=None):
            payload = {"key": key, "label": label, "requester": requester, "public_key": public_key}
            if ttl_minutes:
                payload["ttl_minutes"] = int(ttl_minutes)
            return _relay("POST", "/api/v1/requests", payload)


        @tool("secret_status", "Has the human submitted yet? Returns pending, submitted, picked up, expired or cancelled.",
              {"request_id": {"type": "string"}, "pickup_secret": {"type": "string"}}, ["request_id", "pickup_secret"])
        def secret_status(request_id, pickup_secret):
            return _relay("GET", "/api/v1/requests/" + urllib.parse.quote(str(request_id), safe=""), pickup=pickup_secret)


        @tool("cancel_secret_request", "Cancel a request that is no longer needed so its link stops working.",
              {"request_id": {"type": "string"}, "pickup_secret": {"type": "string"}}, ["request_id", "pickup_secret"])
        def cancel_secret_request(request_id, pickup_secret):
            return _relay("DELETE", "/api/v1/requests/" + urllib.parse.quote(str(request_id), safe=""), pickup=pickup_secret)


        if __name__ == "__main__":
            asyncio.run(main())
    x-runtipi:
      is_main: true
      internal_port: 8792
    init: true
    volumes:
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    ports:
      - 127.0.0.1:${APP_PORT}:8792
  secret-drop-engine:
    image: ghcr.io/humanitylabs-org/secret-drop:0.1.1@sha256:29ebc6a7846e6036afc471dc6ddcee31a9cac3a0ce8f00d59cd1186c80c03302
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    environment:
      SECRET_DROP_DATA_DIR: /data
      SECRET_DROP_BIND: 0.0.0.0
      SECRET_DROP_PORT: "8792"
      SECRET_DROP_PUBLIC_URL: ${SECRET_DROP_PUBLIC_URL:-}
      SECRET_DROP_API_TOKEN: ${SECRET_DROP_API_TOKEN:-}
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
x-runtipi:
  schema_version: 2
  overrides: []
