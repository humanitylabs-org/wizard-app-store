# browser: the main service is a small MCP front (mcp/front.py + mcp/tools.py, inlined by mcp/inline.py).
# It serves the app's MCP at /mcp and passes every other request unchanged to browser-engine,
# the unmodified upstream container, which is reachable only on this app's private network.
services:
  browser:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    user: 1000:1000
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    environment:
      WIZARD_APP: browser
      APP_VERSION: 155.0.8059.42
      FRONT_PORT: '9222'
      UPSTREAM_HOST: browser-engine
      UPSTREAM_PORT: '9222'
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
    - browser-engine
    - browser-reader
    command:
    - python
    - -c
    # BEGIN MCP FRONT (generated by mcp/inline.py)
    - |
      """Browser front: private MCP/CDP for agents and an explicit public Reader route allowlist.
      Reader HTML is served by a separate app-domain service; source pages are never proxied here.
      Stdlib only, so it runs on a stock python image with no build step.
      Generated from the app repo's mcp/ folder; edit there, then run mcp/inline.py."""
      import asyncio
      import contextvars
      import base64
      import json
      import os
      import socket
      import struct
      import time
      import urllib.parse
      import urllib.request
      import uuid
      import re

      APP = os.environ.get("WIZARD_APP", "app")
      VERSION = os.environ.get("APP_VERSION", "0")
      PORT = int(os.environ.get("FRONT_PORT", "8080"))
      UP_HOST = os.environ.get("UPSTREAM_HOST", "")
      UP_PORT = int(os.environ.get("UPSTREAM_PORT", str(PORT)))
      MCP_PATH = "/mcp"
      MCP_TOKEN = os.environ.get("MCP_TOKEN", "")  # when set, /mcp needs Authorization: Bearer <token>
      MAX_HEAD = 65536
      MAX_BODY = 1 << 20
      TOOLS = {}
      REQUEST = contextvars.ContextVar("request", default={})  # headers of the current /mcp call


      def tool(name, description, props=None, required=()):
          def deco(fn):
              schema = {"type": "object", "properties": props or {}, "required": list(required)}
              TOOLS[name] = ({"name": name, "description": description, "inputSchema": schema}, fn)
              return fn
          return deco


      def up_addr():
          try:
              return socket.gethostbyname(UP_HOST)
          except OSError:
              return UP_HOST


      def http(method, path, body=None, headers=None, timeout=60):
          url = "http://%s:%d%s" % (up_addr(), UP_PORT, path)
          req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
          with urllib.request.urlopen(req, timeout=timeout) as r:
              return r.status, r.read()


      def err(i, code, message):
          return {"jsonrpc": "2.0", "id": i, "error": {"code": code, "message": message}}


      def rpc(msg):
          m, i, p = msg.get("method"), msg.get("id"), msg.get("params") or {}
          if m == "initialize":
              r = {"protocolVersion": p.get("protocolVersion", "2025-06-18"), "capabilities": {"tools": {}},
                   "serverInfo": {"name": APP, "version": VERSION}}
          elif m == "tools/list":
              r = {"tools": [t[0] for t in TOOLS.values()]}
          elif m == "tools/call":
              name, args = p.get("name"), p.get("arguments") or {}
              if name not in TOOLS:
                  return err(i, -32602, "unknown tool %s" % name)
              try:
                  out = TOOLS[name][1](**args)
                  if isinstance(out, dict) and "_content" in out:
                      r = {"content": out["_content"]}
                  else:
                      text = out if isinstance(out, str) else json.dumps(out, indent=2)
                      r = {"content": [{"type": "text", "text": text[:200000]}]}
              except Exception as e:  # tool errors go back to the agent, not the transport
                  r = {"content": [{"type": "text", "text": "%s: %s" % (type(e).__name__, e)}], "isError": True}
          elif m == "ping":
              r = {}
          elif i is None:
              return None  # notification
          else:
              return err(i, -32601, "unknown method %s" % m)
          return {"jsonrpc": "2.0", "id": i, "result": r}


      REASONS = {200: "OK", 202: "Accepted", 400: "Bad Request", 404: "Not Found", 405: "Method Not Allowed",
                 401: "Unauthorized", 413: "Payload Too Large", 502: "Bad Gateway"}


      async def respond(writer, code, obj=None, extra=""):
          body = b"" if obj is None else json.dumps(obj).encode()
          head = "HTTP/1.1 %d %s\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n%s\r\n" % (
              code, REASONS.get(code, "OK"), len(body), extra)
          writer.write(head.encode() + body)
          try:
              await writer.drain()
          finally:
              writer.close()


      async def mcp(reader, writer, method, rest):
          headers = {}
          for line in rest.decode("latin-1").split("\r\n"):
              if ":" in line:
                  k, v = line.split(":", 1)
                  headers[k.strip().lower()] = v.strip()
          if any(k.startswith(("x-forwarded-", "tailscale-user-")) or k in ("forwarded", "via", "x-real-ip", "x-wizard-origin") for k in headers):
              return await respond(writer, 403, {"error": "MCP is only available to agents on the private app network"})
          if MCP_TOKEN:
              import hmac
              if not hmac.compare_digest(headers.get("authorization", "").encode(), ("Bearer " + MCP_TOKEN).encode()):
                  return await respond(writer, 401, {"error": "this MCP needs Authorization: Bearer <token>"}, 'WWW-Authenticate: Bearer\r\n')
          if method != "POST":
              return await respond(writer, 405, {"error": "use POST %s" % MCP_PATH}, "Allow: POST\r\n")
          n = int(headers.get("content-length") or 0)
          if n > MAX_BODY:
              return await respond(writer, 413, {"error": "request too large"})
          body = await reader.readexactly(n) if n else b""
          try:
              msg = json.loads(body or b"{}")
          except ValueError:
              return await respond(writer, 400, err(None, -32700, "parse error"))
          REQUEST.set(headers)
          batch = msg if isinstance(msg, list) else [msg]
          results = await asyncio.gather(*(asyncio.to_thread(rpc, x) for x in batch if isinstance(x, dict)))
          out = [x for x in results if x]
          if not out:
              return await respond(writer, 202)
          await respond(writer, 200, out if isinstance(msg, list) else out[0])


      async def pipe(r, w):
          try:
              while True:
                  data = await r.read(65536)
                  if not data:
                      break
                  w.write(data)
                  await w.drain()
          except (ConnectionError, OSError):
              pass
          finally:
              try:
                  w.close()
              except Exception:
                  pass


      async def handle(reader, writer):
          try:
              head = await reader.readuntil(b"\r\n\r\n")
          except (asyncio.IncompleteReadError, asyncio.LimitOverrunError, ConnectionError):
              writer.close()
              return
          line, _, rest = head.partition(b"\r\n")
          parts = line.decode("latin-1").split(" ")
          path = parts[1].split("?", 1)[0] if len(parts) >= 3 else ""
          parsed_headers = {}
          for item in rest.decode("latin-1").split("\r\n"):
              if ":" in item:
                  k, v = item.split(":", 1)
                  parsed_headers[k.strip().lower()] = v.strip()
          forwarded = any(k.startswith(("x-forwarded-", "tailscale-user-")) or k in ("forwarded", "via", "x-real-ip", "x-wizard-origin") for k in parsed_headers)
          public_paths = {"/", "/reader", "/index.html", "/app.js", "/styles.css", "/wizard-ui.css", "/wizard-tokens.css", "/boot.js", "/health", "/api/reader", "/api/image"}
          is_list = path == "/api/list" or bool(re.fullmatch(r"/api/list/[a-f0-9-]{36}", path))
          if path in public_paths or is_list:
              allowed = ("GET", "HEAD", "POST") if path == "/api/list" else (("PATCH", "DELETE") if is_list else ("GET", "HEAD"))
              lengths = [v.split(":", 1)[1].strip() for v in rest.decode("latin-1").split("\r\n") if v.lower().startswith("content-length:")]
              if len(lengths) > 1 or (lengths and not lengths[0].isdigit()):
                  return await respond(writer, 400, {"error": "invalid request length"})
              n = int(lengths[0]) if lengths else 0
              if parts[0] not in allowed or parsed_headers.get("upgrade") or parsed_headers.get("transfer-encoding") or (n and parts[0] in ("GET", "HEAD")):
                  return await respond(writer, 405, {"error": "method not supported"})
              if n > 16384:
                  return await respond(writer, 413, {"error": "request too large"})
              try:
                  ur, uw = await asyncio.open_connection(os.environ.get("READER_HOST", "browser-reader"), int(os.environ.get("READER_PORT", "8080")))
              except OSError:
                  return await respond(writer, 502, {"error": "Reader is starting"})
              req_lines = [l for l in head.decode("latin-1").split("\r\n") if l and not l.lower().startswith(("connection:", "keep-alive:"))]
              uw.write(("\r\n".join(req_lines) + "\r\nConnection: close\r\n\r\n").encode("latin-1"))
              await uw.drain()
              return await relay_once(reader, writer, ur, uw, req_lines)
          if forwarded:
              return await respond(writer, 403, {"error": "DevTools and MCP are private agent interfaces"})
          if path == MCP_PATH:
              return await mcp(reader, writer, parts[0], rest)
          if not UP_HOST:
              return await respond(writer, 404, {"error": "not found"})
          try:
              ur, uw = await asyncio.open_connection(UP_HOST, UP_PORT)
          except OSError:
              return await respond(writer, 502, {"error": "%s is starting or not reachable" % APP})
          # One request per proxied connection (unless it is an upgrade such as a WebSocket), so a
          # later /mcp request can never ride an upstream keep-alive connection.
          lines = head.decode("latin-1").split("\r\n")
          if not any(l.lower().startswith("upgrade:") for l in lines):
              lines = [l for l in lines if l and not l.lower().startswith(("connection:", "keep-alive:"))]
              head = ("\r\n".join(lines) + "\r\nConnection: close\r\n\r\n").encode("latin-1")
          uw.write(head)
          await uw.drain()
          if any(l.lower().startswith("upgrade:") for l in lines):
              await asyncio.gather(pipe(reader, uw), pipe(ur, writer))
          else:
              await relay_once(reader, writer, ur, uw, lines)


      def _length(lines):
          for l in lines:
              if l.lower().startswith("content-length:"):
                  try:
                      return max(0, int(l.split(":", 1)[1].strip()))
                  except ValueError:
                      return None
          return None


      async def relay_once(reader, writer, ur, uw, req_lines):
          """Exactly one request and one response, then close both sides: some upstreams (Chrome DevTools) ignore
          Connection: close, and a client's next request on a kept-alive socket must reach /mcp, not the upstream."""
          try:
              n = _length(req_lines)
              if n:
                  uw.write(await reader.readexactly(n))
                  await uw.drain()
              elif any(l.lower().startswith("transfer-encoding:") for l in req_lines):
                  asyncio.ensure_future(pipe(reader, uw))
              head = await ur.readuntil(b"\r\n\r\n")
              rlines = head.decode("latin-1").split("\r\n")
              rlines = [l for l in rlines if l and not l.lower().startswith(("connection:", "keep-alive:"))]
              writer.write(("\r\n".join(rlines) + "\r\nConnection: close\r\n\r\n").encode("latin-1"))
              rn = _length(rlines[1:])
              status = rlines[0].split(" ")[1] if len(rlines[0].split(" ")) > 1 else ""
              if rn is not None or status in ("204", "304") or req_lines[0].startswith("HEAD "):
                  if rn:
                      writer.write(await ur.readexactly(rn))
                  await writer.drain()
              else:
                  await writer.drain()
                  await pipe(ur, writer)
          except (asyncio.IncompleteReadError, asyncio.LimitOverrunError, ConnectionError, OSError):
              pass
          finally:
              for w in (uw, writer):
                  try:
                      w.close()
                  except Exception:
                      pass


      async def main():
          srv = await asyncio.start_server(handle, "0.0.0.0", PORT, limit=MAX_HEAD)
          async with srv:
              await srv.serve_forever()


      # ---- tools for this app ----
      def _reading_list(method="GET", data=None):
          host = os.environ.get("READER_HOST", "browser-reader")
          port = int(os.environ.get("READER_PORT", "8080"))
          body = None if data is None else json.dumps(data).encode()
          request = urllib.request.Request("http://%s:%d/api/list" % (host, port), data=body,
                                           method=method, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=60) as response:
              return json.load(response)


      @tool("reading_list_add", "Save a public article to the owner's Reading list. Fetches fresh safe Reader metadata, deduplicates the canonical address and stores no article body or cookies.",
            {"url": {"type": "string"}}, ["url"])
      def reading_list_add(url):
          return _reading_list("POST", {"url": url})


      @tool("reading_list_list", "List the owner's saved article metadata, newest first, including read status. Does not fetch article bodies.")
      def reading_list_list():
          return _reading_list()


      PAGE_TEXT_MAX = 100000


      def _devtools(path, method="GET"):
          _, raw = http(method, path, timeout=30)
          return json.loads(raw) if raw else {}


      class _WS:
          """Minimal WebSocket client for one Chrome DevTools target (text frames only)."""

          def __init__(self, url):
              u = urllib.parse.urlparse(url)
              self.sock = socket.create_connection((up_addr(), UP_PORT), timeout=60)
              key = base64.b64encode(os.urandom(16)).decode()
              req = ("GET %s HTTP/1.1\r\nHost: %s:%d\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n"
                     "Sec-WebSocket-Key: %s\r\nSec-WebSocket-Version: 13\r\n\r\n") % (u.path, up_addr(), UP_PORT, key)
              self.sock.sendall(req.encode())
              head = b""
              while b"\r\n\r\n" not in head:
                  chunk = self.sock.recv(4096)
                  if not chunk:
                      raise ConnectionError("DevTools closed the connection")
                  head += chunk
              if b" 101 " not in head.split(b"\r\n", 1)[0]:
                  raise ConnectionError("DevTools refused the WebSocket")
              self.buf = head.split(b"\r\n\r\n", 1)[1]
              self.n = 0

          def _read(self, n):
              while len(self.buf) < n:
                  chunk = self.sock.recv(1 << 16)
                  if not chunk:
                      raise ConnectionError("DevTools closed the connection")
                  self.buf += chunk
              out, self.buf = self.buf[:n], self.buf[n:]
              return out

          def send(self, obj):
              data = json.dumps(obj).encode()
              mask = os.urandom(4)
              n = len(data)
              head = bytes([0x81]) + (bytes([0x80 | n]) if n < 126 else
                                      (bytes([0x80 | 126]) + struct.pack(">H", n) if n < 65536 else bytes([0x80 | 127]) + struct.pack(">Q", n)))
              self.sock.sendall(head + mask + bytes(b ^ mask[i % 4] for i, b in enumerate(data)))

          def recv(self):
              msg = b""
              while True:
                  b1, b2 = self._read(2)
                  n = b2 & 0x7F
                  if n == 126:
                      n = struct.unpack(">H", self._read(2))[0]
                  elif n == 127:
                      n = struct.unpack(">Q", self._read(8))[0]
                  payload = self._read(n)
                  op = b1 & 0x0F
                  if op == 8:
                      raise ConnectionError("DevTools closed the WebSocket")
                  if op in (0, 1):
                      msg += payload
                      if b1 & 0x80:
                          return json.loads(msg)

          def call(self, method, params=None):
              self.n += 1
              self.send({"id": self.n, "method": method, "params": params or {}})
              while True:
                  m = self.recv()
                  if m.get("id") == self.n:
                      if "error" in m:
                          raise RuntimeError(m["error"].get("message"))
                      return m.get("result") or {}

          def close(self):
              try:
                  self.sock.close()
              except OSError:
                  pass


      def _check_url(url):
          if urllib.parse.urlparse(str(url)).scheme not in ("http", "https"):
              raise ValueError("only http(s) URLs")
          return str(url)


      def _with_page(url, fn, width=1280, height=800, wait_ms=1500):
          target = _devtools("/json/new?" + urllib.parse.quote(_check_url(url), safe=""), "PUT")
          ws = _WS(target["webSocketDebuggerUrl"])
          try:
              ws.call("Emulation.setDeviceMetricsOverride", {"width": int(width), "height": int(height), "deviceScaleFactor": 1, "mobile": False})
              ws.call("Page.enable")
              ws.call("Page.navigate", {"url": url})
              deadline = time.time() + 30
              while time.time() < deadline:
                  state = ws.call("Runtime.evaluate", {"expression": "document.readyState", "returnByValue": True})
                  if state.get("result", {}).get("value") == "complete":
                      break
                  time.sleep(0.25)
              time.sleep(max(0, min(int(wait_ms), 10000)) / 1000)
              return fn(ws)
          finally:
              ws.close()
              try:
                  _devtools("/json/close/" + target["id"])
              except Exception:
                  pass


      @tool("browser_status", "Check the shared Browser is up: Chromium version, open tabs, and the DevTools address other apps use.")
      def browser_status():
          v = _devtools("/json/version")
          tabs = [{"id": t.get("id"), "url": t.get("url"), "title": t.get("title")} for t in _devtools("/json/list") if t.get("type") == "page"]
          return {"ok": True, "browser": v.get("Browser"), "tabs": tabs,
                  "devtools_for_apps": "http://browser:9222 (Puppeteer/Playwright connect over the Runtipi network)"}


      @tool("read_page", "Open a URL in the shared headless browser (JavaScript runs) and return the page title and visible text.",
            {"url": {"type": "string"}, "wait_ms": {"type": "integer", "description": "Extra wait after load, max 10000 (default 1500)"}},
            ["url"])
      def read_page(url, wait_ms=1500):
          def get(ws):
              r = ws.call("Runtime.evaluate", {"expression": "JSON.stringify({title: document.title, url: location.href, text: document.body ? document.body.innerText : ''})",
                                               "returnByValue": True})
              d = json.loads(r.get("result", {}).get("value") or "{}")
              d["text"] = (d.get("text") or "")[:PAGE_TEXT_MAX]
              return d
          return _with_page(url, get, wait_ms=wait_ms)


      @tool("screenshot", "Open a URL in the shared headless browser and return a PNG screenshot.",
            {"url": {"type": "string"}, "width": {"type": "integer", "description": "Viewport width, default 1280"},
             "height": {"type": "integer", "description": "Viewport height, default 800"},
             "full_page": {"type": "boolean", "description": "Capture the whole page, not just the viewport"},
             "wait_ms": {"type": "integer", "description": "Extra wait after load, max 10000 (default 1500)"}},
            ["url"])
      def screenshot(url, width=1280, height=800, full_page=False, wait_ms=1500):
          width, height = max(200, min(int(width), 3840)), max(200, min(int(height), 4000))

          def shot(ws):
              r = ws.call("Page.captureScreenshot", {"format": "png", "captureBeyondViewport": bool(full_page)})
              return {"_content": [{"type": "image", "data": r["data"], "mimeType": "image/png"},
                                   {"type": "text", "text": "Screenshot of %s (%dx%d%s)" % (url, width, height, ", full page" if full_page else "")}]}
          return _with_page(url, shot, width, height, wait_ms)


      if __name__ == "__main__":
          asyncio.run(main())
    # END MCP FRONT
    ports:
    - 127.0.0.1:${APP_PORT}:9222
    x-runtipi:
      is_main: true
  browser-reader:
    image: ghcr.io/humanitylabs-org/browser-reader:sha-04f94544e7f22d8196c65e4e3954da08e5e49c38@sha256:fb7e1e543b5fd341d10c8805fe49d1f65500c9f08b0df84e0f60e4a236550c32
    user: 1000:1000
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    # Playwright's CDP client needs a writable temp directory (artifacts) on a read-only root.
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m
    volumes:
    - reading-list:/data
    environment:
      READER_DATA_DIR: /data
      TMPDIR: /tmp
      UPSTREAM_HOST: browser-engine
      UPSTREAM_PORT: "9222"
      READER_DENY_PROXY: http://browser-reader:8081
      READER_DENY_HOSTS: ${READER_DENY_HOSTS:-}
    depends_on: [browser-engine]
  browser-engine:
    image: chromedp/headless-shell:155.0.8059.40@sha256:0dc9356ce1428962cddcf938dab712a8c56de79adc326f9138298f13df440071
    user: 1000:1000
    read_only: true
    init: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    shm_size: 2g
    pids_limit: 4096
    mem_limit: 6g
    memswap_limit: 6g
    tmpfs:
    - /tmp:rw,nosuid,size=2g
    environment:
      HOME: /tmp
volumes:
  reading-list: {}
x-runtipi:
  schema_version: 2
  overrides: []
