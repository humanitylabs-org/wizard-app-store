services:
  transcriber:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    environment:
      LOG_LEVEL: info
      ENABLE_UI: "false"
      WHISPER__COMPUTE_TYPE: int8
      PRELOAD_MODELS: '["${TRANSCRIBER_MODEL}"]'
    volumes:
      - ${APP_DATA_DIR}/data/huggingface:/home/ubuntu/.cache/huggingface
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
  overrides: []
