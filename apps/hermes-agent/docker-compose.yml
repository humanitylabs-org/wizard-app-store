services:
  hermes-agent:
    image: ghcr.io/humanitylabs-org/hermes-agent:v2026.9.24-wizard1
    command: ["gateway", "run"]
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
      # The Claude sign-in made in the AI Accounts app (same fixed volume name there).
      - claude-login:/claude
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    x-runtipi:
      is_main: true
      internal_port: 9119
volumes:
  claude-login:
    name: wizard-ai-accounts-claude
x-runtipi:
  schema_version: 2
  overrides: []
