services:
  hermes-agent:
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    command: ["gateway", "run"]
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    x-runtipi:
      is_main: true
      internal_port: 9119
  # The one store-specific addition (sidecars/wizard-apps/README.md): connects installed Wizard apps
  # to Hermes and keeps one wizard-apps skill current. Same official image, its own process; the
  # hermes-agent service above stays vanilla. Turn it off with the "Connect Wizard apps" setting.
  wizard-apps:
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    entrypoint: ["/opt/hermes/.venv/bin/python3", "-c"]
    command:
      - |
        # Wizard apps sync bootstrap: python3 -c <this> <wizard_core.py> <hermes_adapter.py>
        # Loads the two modules passed as arguments (sources: sidecars/wizard-apps/ in the Wizard App Store).
        import sys, types
        for name, source in (("wizard_core", sys.argv[1]), ("hermes_adapter", sys.argv[2])):
            module = types.ModuleType(name)
            module.__file__ = name + ".py"
            sys.modules[name] = module
            exec(compile(source, name + ".py", "exec"), module.__dict__)
        sys.modules["hermes_adapter"].main()
      - |
        """Wizard apps discovery core: agent-agnostic and deterministic (contract: README.md, "Core").

        Inputs: the Wizard App Store app list (fetched from GitHub about hourly, cached, with a built-in
        fallback) and TCP/MCP probes on the Runtipi network. Output: <state_dir>/apps.json, the reachable
        Wizard apps sorted by id, written only when its bytes change. No clocks, randomness or LLM in the
        output: the same store list and probe results always give byte-identical apps.json.
        """
        import json
        import os
        import re
        import socket
        import urllib.error
        import urllib.parse
        import urllib.request
        from pathlib import Path

        CORE_VERSION = 1
        ID_RE = re.compile(r"[a-z0-9][a-z0-9-]{0,62}")
        PATH_RE = re.compile(r"/[A-Za-z0-9._~/-]{0,200}")
        STORE_TYPES = ("service", "external")

        # Used only when the store has never been reachable from this server.
        BUILTIN_APPS = [
            {"id": "browser", "name": "Browser", "port": 9222, "short_desc": "Service: Shared headless Chromium."},
            {"id": "defleur-video", "name": "DeFleur Video (Testing)", "port": 8787, "mcp_path": "/mcp",
             "short_desc": "Service: Edit talking-head videos into vertical shorts."},
            {"id": "secret-drop", "name": "Secret Drop", "port": 8792, "short_desc": "Service: One-time encrypted secret handoff."},
            {"id": "transcriber", "name": "Transcriber", "port": 8000, "short_desc": "Service: Local speech-to-text."},
        ]

        _said: dict = {}


        def say(key, msg):
            """Log a line only when it changes, so logs stay tiny."""
            if _said.get(key) != msg:
                _said[key] = msg
                print("[wizard-apps] " + msg, flush=True)


        def read_json(path, default):
            try:
                return json.loads(Path(path).read_text(encoding="utf-8"))
            except (OSError, ValueError):
                return default


        def write_if_changed(path, text):
            """Atomically replace *path* with *text* unless it already holds exactly that. True if written."""
            path = Path(path)
            try:
                if path.read_text(encoding="utf-8") == text:
                    return False
            except OSError:
                pass
            path.parent.mkdir(parents=True, exist_ok=True)
            tmp = path.with_name("." + path.name + ".tmp")
            tmp.write_text(text, encoding="utf-8")
            os.chmod(tmp, 0o644)
            os.replace(tmp, path)
            return True


        def parse_app(cfg, compose):
            """A store app's config.json + docker-compose.yml -> {id, name, short_desc, port[, mcp_path]} or None."""
            if not isinstance(cfg, dict) or not isinstance(compose, dict):
                return None
            aid, mcp_path = cfg.get("id"), cfg.get("wizard_mcp_path")
            if not isinstance(aid, str) or not ID_RE.fullmatch(aid) or cfg.get("wizard_type") not in STORE_TYPES:
                return None
            services = compose.get("services") or {}
            svc = services.get(aid) or next((s for s in services.values() if (s.get("x-runtipi") or {}).get("is_main")), None)
            if not isinstance(svc, dict):
                return None
            port = (svc.get("x-runtipi") or {}).get("internal_port")
            if not port and svc.get("ports"):
                port = str(svc["ports"][0]).rsplit(":", 1)[-1].split("/")[0]
            try:
                port = int(str(port))
            except ValueError:
                return None
            app = {"id": aid, "name": str(cfg.get("name") or aid)[:80], "short_desc": str(cfg.get("short_desc") or "")[:160],
                   "port": port}
            if isinstance(mcp_path, str) and PATH_RE.fullmatch(mcp_path):
                app["mcp_path"] = mcp_path
            return app


        def http_get(url):
            req = urllib.request.Request(url, headers={"User-Agent": f"wizard-apps-core/{CORE_VERSION}"})
            with urllib.request.urlopen(req, timeout=15) as res:
                return res.read(1 << 20)


        def fetch_store(repo, ref, get=http_get):
            """Every usable app in the public store at repo@ref (GitHub contents API + raw files)."""
            import yaml
            listing = json.loads(get(f"https://api.github.com/repos/{repo}/contents/apps?ref={urllib.parse.quote(ref)}"))
            apps = []
            for entry in listing:
                name = entry.get("name", "")
                if entry.get("type") != "dir" or not ID_RE.fullmatch(name):
                    continue
                raw = f"https://raw.githubusercontent.com/{repo}/{ref}/apps/{name}/"
                try:
                    app = parse_app(json.loads(get(raw + "config.json")), yaml.safe_load(get(raw + "docker-compose.yml")))
                except (OSError, ValueError, yaml.YAMLError):
                    continue
                if app:
                    apps.append(app)
            if not apps:
                raise ValueError("store listed no usable apps")
            return apps


        def load_store(state_dir, repo, ref, now, refresh_s=3600, fetch=fetch_store):
            """Store app list: cached in <state_dir>/store.json, refetched after refresh_s, built-in when never fetched."""
            cache_path = Path(state_dir) / "store.json"
            cache = read_json(cache_path, {})
            if not isinstance(cache, dict):
                cache = {}
            stale = "fetched_at" not in cache or now - cache["fetched_at"] > refresh_s
            due = stale and now >= cache.get("retry_at", 0)
            if due:
                try:
                    cache = {"fetched_at": now, "source": f"{repo}@{ref}", "apps": fetch(repo, ref)}
                    say("store", f"store list from {repo}@{ref}: {len(cache['apps'])} apps")
                except Exception as exc:  # offline or GitHub unavailable: keep working, retry in 10 min
                    cache["retry_at"] = now + 600
                    say("store", f"store fetch failed ({type(exc).__name__}); using the {'cached' if cache.get('apps') else 'built-in'} list")
                write_if_changed(cache_path, json.dumps(cache, indent=1, sort_keys=True) + "\n")
            return cache.get("apps") or BUILTIN_APPS


        def tcp_probe(host, port):
            try:
                socket.create_connection((host, port), timeout=3).close()
                return True
            except OSError:
                return False


        def mcp_probe(url):
            """(ready, note): does *url* answer an MCP initialize? The probe session is closed again."""
            body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
                "protocolVersion": "2025-03-26", "capabilities": {},
                "clientInfo": {"name": "wizard-apps-core", "version": str(CORE_VERSION)}}}).encode()
            headers = {"Content-Type": "application/json", "Accept": "application/json, text/event-stream"}
            try:
                with urllib.request.urlopen(urllib.request.Request(url, body, headers), timeout=15) as res:
                    session = res.headers.get("Mcp-Session-Id")
                    text = res.read(65536).decode("utf-8", "replace")
            except urllib.error.HTTPError as exc:
                return False, "needs a token" if exc.code in (401, 403) else f"HTTP {exc.code}"
            except OSError as exc:
                return False, type(exc).__name__
            if session:
                try:
                    urllib.request.urlopen(urllib.request.Request(url, method="DELETE", headers={"Mcp-Session-Id": session}),
                                           timeout=5).close()
                except OSError:
                    pass
            ok = '"serverInfo"' in text or '"protocolVersion"' in text
            return ok, "" if ok else "not an MCP endpoint"


        def discover(store_apps, tcp=tcp_probe, mcp=mcp_probe):
            """Reachable apps, sorted by id, one entry per id (first wins). Deterministic given the probe results."""
            seen, out = set(), []
            for app in sorted(store_apps, key=lambda a: str(a.get("id"))):
                aid = app.get("id")
                if aid in seen or not isinstance(aid, str) or not ID_RE.fullmatch(aid):
                    continue
                seen.add(aid)
                if not tcp(aid, app["port"]):
                    continue
                url = f"http://{aid}:{app['port']}"
                entry = {"id": aid, "name": app.get("name") or aid, "description": app.get("short_desc", ""),
                         "type": "http", "url": url, "mcp_url": None, "mcp_ready": False, "note": ""}
                if app.get("mcp_path"):
                    entry["type"] = "mcp"
                    entry["mcp_url"] = url + app["mcp_path"]
                    entry["mcp_ready"], entry["note"] = mcp(entry["mcp_url"])
                out.append(entry)
            return out


        def render(apps):
            return json.dumps({"version": CORE_VERSION, "apps": apps}, indent=2, sort_keys=True) + "\n"


        def refresh(state_dir, repo, ref, now, refresh_s=3600, fetch=fetch_store, tcp=tcp_probe, mcp=mcp_probe):
            """One discovery cycle: load the store list, probe, write <state_dir>/apps.json if changed.
            Returns (apps, changed)."""
            apps = discover(load_store(state_dir, repo, ref, now, refresh_s, fetch), tcp, mcp)
            changed = write_if_changed(Path(state_dir) / "apps.json", render(apps))
            say("found", "Wizard apps found: " + ", ".join(a["id"] for a in apps) if apps else "no Wizard apps found")
            return apps, changed
      - |
        """Hermes adapter: applies the core's apps.json to Hermes Agent (design: README.md).

        It writes MCP entries only through the Hermes CLI (`hermes config set|unset mcp_servers.<app-id>`)
        and only for apps the core marks as MCP-ready. It touches only entries it created (recorded in
        hermes-state.json) and only while they still match what it wrote. It renders the wizard-apps skill
        from a fixed template. Idempotent: with an unchanged apps.json and config.yaml it makes no CLI
        call and writes no file.
        """
        import json
        import os
        import signal
        import subprocess
        import sys
        import time
        import urllib.parse
        from pathlib import Path

        import wizard_core as core

        ADAPTER_VERSION = 1
        MARKER = "managed-by: wizard-apps-sync"

        # Detailed notes only for apps without MCP tools; MCP apps describe themselves through their tools.
        NOTES = {
            "browser": (
                "Shared headless Chromium (Chrome DevTools Protocol). DevTools rejects host names, so resolve the IP first "
                "(`getent hosts browser`) and connect to `http://<ip>:9222` (Puppeteer `browserURL`, Playwright "
                "`connect_over_cdp`). Use your own browser context and disconnect when done; don't close the browser."),
            "secret-drop": (
                "Use it whenever you need an API key, token or password from the owner; never ask for secrets in chat. "
                "Fetch `http://secret-drop:8792/SKILL.md` and follow it (it uses `http://secret-drop:8792/client.py`)."),
            "transcriber": (
                "OpenAI-compatible speech-to-text with word timings. Base URL `http://transcriber:8000/v1`, any API key "
                "works. List models with `GET /v1/models`, then e.g. `curl -fsS http://transcriber:8000/v1/audio/transcriptions "
                "-F file=@<audio-or-video> -F model=<model-id> -F response_format=verbose_json "
                "-F 'timestamp_granularities[]=word'`."),
        }


        class Hermes:
            """The Hermes side: config.yaml (read), the Hermes CLI (write), the skills folder."""

            def __init__(self, home, cli):
                self.home = Path(home)
                self.config = self.home / "config.yaml"
                self.skill = self.home / "skills" / "wizard-apps" / "SKILL.md"
                self.cli = cli
                self.calls = []

            def ready(self):
                return self.config.exists() and (self.home / "skills").is_dir()

            def servers(self):
                import yaml
                data = yaml.safe_load(self.config.read_text(encoding="utf-8")) or {}
                servers = data.get("mcp_servers") if isinstance(data, dict) else None
                return servers if isinstance(servers, dict) else {}

            def run(self, *args):
                # Hermes' own config lock is per process: let a write in progress settle first, then use its CLI,
                # which writes atomically and keeps comments, key order and every other setting.
                for _ in range(20):
                    if time.time() - self.config.stat().st_mtime >= 3:
                        break
                    time.sleep(1)
                self.calls.append(args)
                env = dict(os.environ, HOME=os.environ.get("HOME") or str(self.home))
                p = subprocess.run([self.cli, *args], capture_output=True, text=True, timeout=180, env=env)
                if p.returncode:
                    core.say("cli", f"hermes {' '.join(args[:2])} failed (exit {p.returncode}): {(p.stderr or p.stdout).strip()[-200:]}")
                return p.returncode == 0


        def ours(entry, url):
            """The on-disk entry is still exactly what this adapter wrote."""
            return isinstance(entry, dict) and set(entry) <= {"url", "enabled"} and entry.get("url") == url \
                and entry.get("enabled", True) is True


        def covered(servers, app):
            """Name of another entry that already points at this app (same host), sorted for stability."""
            host = urllib.parse.urlsplit(app["mcp_url"]).hostname
            for name in sorted(servers):
                entry = servers[name]
                if name != app["id"] and isinstance(entry, dict) and urllib.parse.urlsplit(str(entry.get("url") or "")).hostname == host:
                    return name
            return ""


        def tool_prefix(name):
            return "mcp__" + "".join(c if c.isalnum() or c == "_" else "_" for c in name) + "__"


        def render_skill(apps, servers):
            """Fixed template; the same apps.json and mcp_servers always give the same text."""
            lines = [
                "---", "name: wizard-apps",
                "description: Use for Wizard apps on this server (video, speech, secrets).",
                f"version: {ADAPTER_VERSION}.0.0", "author: Wizard App Store", "license: MIT",
                "metadata:", "  hermes:", "    tags: [wizard-apps, runtipi, mcp]", "---", "",
                "# Wizard apps on this server", "",
                f"<!-- {MARKER}. Rewritten automatically; edits here are overwritten. -->", "",
            ]
            if not apps:
                return "\n".join(lines + [
                    "No Wizard apps are running right now. The owner can add one with one click in Runtipi "
                    "(Wizard App Store); it is connected here within about a minute.", ""])
            lines += ["## Installed now", ""]
            with_tools = False
            for app in apps:
                if app["type"] == "mcp":
                    name = app["id"] if app["id"] in servers else covered(servers, app)
                    entry = servers.get(name) if name else None
                    if isinstance(entry, dict) and entry.get("enabled", True) is not False:
                        with_tools = True
                        lines.append(f"- **{app['name']}**: its tools `{tool_prefix(name)}*` are connected.")
                    else:
                        lines.append(f"- **{app['name']}**: running at `{app['url']}`, but its tools are not connected yet "
                                     "(starting, turned off by the owner, or it needs a token).")
                else:
                    note = NOTES.get(app["id"]) or f"{app['description'].split(': ', 1)[-1]} Internal URL: `{app['url']}`."
                    lines.append(f"- **{app['name']}**: {note}")
            lines.append("")
            if with_tools:
                lines += ["## Apps with tools", "",
                          "Their tools are already connected. Call the app's `workflow_guide` (or `capabilities`) tool first "
                          "and follow it. If the tools are missing in this chat, they were connected after it started: ask "
                          "the owner to start a new chat (/new).", ""]
            lines += [
                "## Files", "",
                "- Files the owner sends in chat are saved under `/opt/data/cache/` (for example `cache/videos/` or "
                "`cache/documents/`); the message gives the path. When an app returns an upload URL or curl command, run "
                "it yourself with that local path. Don't ask the owner to upload.",
                "- Links that apps return use internal addresses like `http://<app-id>:<port>/...`, which the owner's "
                "phone or laptop cannot open. Download the file yourself (`curl -fsSo /opt/data/cache/<name> '<url>'`) "
                "and send it as an attachment (`MEDIA:/opt/data/cache/<name>`). If that isn't possible, tell the owner to "
                "replace the host with the server's address (its Tailscale IP) and the app's port shown in Runtipi.",
                "",
                "## More apps", "",
                "The owner adds the next Wizard app with one click in Runtipi (Wizard App Store); it is connected here "
                "within about a minute.", "",
            ]
            return "\n".join(lines)


        def write_skill(hermes, text):
            if hermes.skill.exists() and MARKER not in hermes.skill.read_text(encoding="utf-8", errors="replace"):
                core.say("skill", "skills/wizard-apps was not written by this sync; leaving it alone")
                return
            if core.write_if_changed(hermes.skill, text):
                core.say("skill", "wizard-apps skill updated")


        def apply(apps, hermes, state, now, grace_s=600):
            """Bring Hermes in line with *apps*. Mutates *state*; calls the CLI only when something must change."""
            owned = state.setdefault("owned", {})
            missing = state.setdefault("missing_since", {})
            servers = hermes.servers()
            ready = {a["id"]: a for a in apps if a["type"] == "mcp" and a["mcp_ready"]}
            for aid in sorted(owned):
                own = owned[aid]
                if own.get("state") != "active":
                    continue
                if not ours(servers.get(aid), own.get("url")):
                    owned[aid] = {"state": "released"}
                    missing.pop(aid, None)
                    core.say("own:" + aid, f"{aid}: the owner changed or removed this MCP entry; leaving it alone from now on")
                elif aid in ready and ready[aid]["mcp_url"] == own["url"]:
                    missing.pop(aid, None)
                else:
                    since = missing.setdefault(aid, now)
                    if now - since >= grace_s and hermes.run("config", "unset", f"mcp_servers.{aid}"):
                        owned[aid] = {"state": "removed"}
                        missing.pop(aid, None)
                        core.say("own:" + aid, f"{aid}: unreachable for {grace_s}s, removed its MCP entry")
            servers = hermes.servers() if hermes.calls else servers
            for aid, app in sorted(ready.items()):
                if owned.get(aid, {}).get("state") in ("active", "released") or aid in servers:
                    continue
                other = covered(servers, app)
                if other:
                    core.say("own:" + aid, f"{aid}: already connected by the owner as '{other}'")
                    continue
                if hermes.run("config", "set", f"mcp_servers.{aid}", json.dumps({"url": app["mcp_url"], "enabled": True})) \
                        and ours(hermes.servers().get(aid), app["mcp_url"]):
                    owned[aid] = {"state": "active", "url": app["mcp_url"]}
                    core.say("own:" + aid, f"{aid}: connected {app['mcp_url']} (tools {tool_prefix(aid)}*)")
            servers = hermes.servers() if hermes.calls else servers
            write_skill(hermes, render_skill(apps, servers))
            return state


        def disable(hermes, state):
            """The owner turned the sync off: undo only what it made."""
            servers = hermes.servers()
            for aid, own in sorted(state.get("owned", {}).items()):
                if own.get("state") == "active" and ours(servers.get(aid), own.get("url")) \
                        and hermes.run("config", "unset", f"mcp_servers.{aid}"):
                    own["state"] = "removed"
            if hermes.skill.exists() and MARKER in hermes.skill.read_text(encoding="utf-8", errors="replace"):
                hermes.skill.unlink()
                if not any(hermes.skill.parent.iterdir()):
                    hermes.skill.parent.rmdir()
            core.say("main", "WIZARD_APPS_SYNC is off: removed this sync's own MCP entries and skill; idle")


        def save_state(path, state):
            core.write_if_changed(path, json.dumps(state, indent=1, sort_keys=True) + "\n")


        def main():
            env = os.environ.get
            home = Path(env("HERMES_HOME") or "/opt/data")
            state_dir = home / "wizard-apps"
            state_path = state_dir / "hermes-state.json"
            repo = env("WIZARD_APPS_STORE_REPO") or "humanitylabs-org/wizard-app-store"
            ref = env("WIZARD_APPS_STORE_REF") or "main"
            interval = int(env("WIZARD_APPS_INTERVAL_S") or 30)
            grace = int(env("WIZARD_APPS_GRACE_S") or 600)
            enabled = (env("WIZARD_APPS_SYNC") or "true").strip().lower() not in {"false", "0", "no", "off"}
            hermes = Hermes(home, env("WIZARD_APPS_HERMES_CLI") or "/opt/hermes/.venv/bin/hermes")
            signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
            core.say("main", f"wizard-apps sync (core {core.CORE_VERSION}, hermes adapter {ADAPTER_VERSION}) started: "
                             f"store {repo}@{ref}, every {interval}s, enabled={enabled}")
            state = core.read_json(state_path, {})
            state = state if isinstance(state, dict) else {}
            while True:
                try:
                    if not hermes.ready():
                        core.say("main", "waiting for Hermes to initialise /opt/data")
                    elif not enabled:
                        disable(hermes, state)
                        save_state(state_path, state)
                        while True:  # cleanup done; idle until the setting changes (container recreate)
                            time.sleep(3600)
                    else:
                        now = int(time.time())
                        apps, _ = core.refresh(state_dir, repo, ref, now)
                        hermes.calls = []
                        apply(apps, hermes, state, now, grace)
                        save_state(state_path, state)
                except Exception as exc:  # never crash-loop; report once and retry next cycle
                    core.say("error", f"cycle failed: {type(exc).__name__}: {str(exc)[:200]}")
                time.sleep(interval)
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 5s
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
    environment:
      HERMES_HOME: /opt/data
      HOME: /opt/data
      WIZARD_APPS_SYNC: ${WIZARD_APPS_SYNC:-true}
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    x-runtipi:
      add_to_main_network: true
x-runtipi:
  schema_version: 2
  overrides: []
