      unified-init:
        condition: service_completed_successfully
    networks:
      - model-lane
      - model-egress
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  connector-init:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-6c185da6716e7e085ad3d2524b08753aa9ec665d@sha256:f7ce9b0c26b69f8f0d6e802c468a4df7a06bfb2e1fb60232210709f49eb6d880}
