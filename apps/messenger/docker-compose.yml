    mem_limit: 512m
    pids_limit: 128
    volumes:
      - ${APP_DATA_DIR}/data/whatsapp:/data
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      connector-init:
        condition: service_completed_successfully
      matrix:
        condition: service_healthy
    networks:
      - matrix-lane
      - connector-egress
    healthcheck:
      test:
        - CMD-SHELL
        - test ! -f /data/configured || curl --fail --silent http://127.0.0.1:29318/_matrix/mau/live >/dev/null
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    environment:
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
  signal:
