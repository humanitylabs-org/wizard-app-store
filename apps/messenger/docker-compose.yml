services:
  unified-init:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-6c185da6716e7e085ad3d2524b08753aa9ec665d@sha256:f7ce9b0c26b69f8f0d6e802c468a4df7a06bfb2e1fb60232210709f49eb6d880}
    user: 0:0
    entrypoint:
      - python3
      - /app/unified_setup.py
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    restart: no
    labels:
      runtipi.managed: "false"
  messenger:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-6c185da6716e7e085ad3d2524b08753aa9ec665d@sha256:f7ce9b0c26b69f8f0d6e802c468a4df7a06bfb2e1fb60232210709f49eb6d880}
    read_only: true
    cap_drop:
      - ALL
    user: 1000:1000
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /run/messenger:rw,noexec,nosuid,size=64m,mode=0700,uid=1000,gid=1000
    environment:
      MESSENGER_API_TOKEN: ${MESSENGER_API_TOKEN:?Messenger capability required}
      MESSENGER_ALLOWED_ORIGINS: ${MESSENGER_ALLOWED_ORIGINS:-}
      MESSENGER_PUBLIC_PATH: ${MESSENGER_PUBLIC_PATH:-/messenger/}
      MESSENGER_COOKIE_SECURE: "1"
      MESSENGER_DATA: /data
      MESSENGER_PORT: "8765"
      MESSENGER_AGENT_INBOX_TOKEN: ${MESSENGER_AGENT_INBOX_TOKEN:-}
      MESSENGER_AGENT_SERVICE: ${MESSENGER_AGENT_SERVICE:-http://wizard-agent-service:8787}
      MESSENGER_VERSION: 0.2.0-unified.16.149
      UNIFIED_ENABLED: "1"
      CONNECTORS_ENABLED: "1"
      MESSENGER_CONNECTOR_SENDER_MODE: local-owner
      MATRIX_URL: http://matrix:8008
      TELEGRAM_BRIDGE_URL: http://telegram:29317
      TRANSLATION_URL: http://translation:8766
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gemma4-31b}
      MESSENGER_BROWSER_DEVTOOLS: http://signin-browser:9222
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      unified-init:
        condition: service_completed_successfully
      matrix:
        condition: service_healthy
      connector-init:
        condition: service_completed_successfully
    networks:
      - matrix-lane
      - model-lane
      - relay-egress
      - signin-lane
      - call-lane
      - tunnel-lane
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${APP_PORT}:8765
    x-runtipi:
      is_main: true
      internal_port: 8765
  matrix:
    image: ghcr.io/element-hq/synapse:v1.166.0@sha256:2cdc84f1de4687af89e4b7b1fe7b5f93e0ee7913243b63f79b05319cb6a8f525
    user: 1000:1000
    entrypoint:
      - /bin/sh
      - -c
    command:
      - if [ -f /data/synapse_start.py ]; then exec python /data/synapse_start.py; fi; exec python -m synapse.app.homeserver --config-path /data/homeserver.yaml
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    mem_limit: 768m
    pids_limit: 128
    volumes:
      - ${APP_DATA_DIR}/data/matrix:/data
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      unified-init:
        condition: service_completed_successfully
      connector-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    networks:
      - matrix-lane
      - postgres-lane
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=4)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20m
    restart: unless-stopped
    environment:
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    user: 1000:1000
    entrypoint:
      - /bin/sh
      - -c
    command:
      - trap "exit 0" TERM INT; until [ -f /pg/enabled ]; do sleep 5 & wait $$!; done; exec docker-entrypoint.sh postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /var/run/postgresql:rw,noexec,nosuid,size=8m,uid=1000,gid=1000
    mem_limit: 256m
    pids_limit: 64
    environment:
      PGDATA: /pg/db
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /pg/password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/pg
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      unified-init:
        condition: service_completed_successfully
    networks:
      - postgres-lane
    stop_grace_period: 30s
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    user: 1000:1000
    entrypoint:
      - /bin/sh
      - -c
    command:
      - trap "kill $$p 2>/dev/null; exit 0" TERM INT; while :; do until [ -f /calls/enabled ]; do sleep 2 & wait $$!; done; g=$$(cat /calls/livekit.gen 2>/dev/null); /livekit-server --config /calls/livekit.yaml & p=$$!; while [ -f /calls/enabled ] && [ "$$(cat /calls/livekit.gen 2>/dev/null)" = "$$g" ] && kill -0 $$p 2>/dev/null; do sleep 2 & wait $$!; done; kill $$p 2>/dev/null; wait $$p; done
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - ${APP_DATA_DIR}/data/calls:/calls:ro
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      unified-init:
        condition: service_completed_successfully
    networks:
      - call-lane
      - call-egress
    stop_grace_period: 10s
    restart: unless-stopped
    environment:
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
  call-auth:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-6c185da6716e7e085ad3d2524b08753aa9ec665d@sha256:f7ce9b0c26b69f8f0d6e802c468a4df7a06bfb2e1fb60232210709f49eb6d880}
    user: 1000:1000
    entrypoint:
      - /bin/sh
      - -c
    command:
      - trap "kill $$p 2>/dev/null; exit 0" TERM INT; while :; do until [ -f /calls/enabled ]; do sleep 2 & wait $$!; done; /usr/local/bin/lk-jwt-service & p=$$!; while [ -f /calls/enabled ] && kill -0 $$p 2>/dev/null; do sleep 2 & wait $$!; done; kill $$p 2>/dev/null; wait $$p; done
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    mem_limit: 128m
    pids_limit: 64
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_KEY_FILE: /calls/livekit-keys.yaml
      LIVEKIT_JWT_BIND: :8080
      LIVEKIT_FULL_ACCESS_HOMESERVERS: messenger.internal
      LIVEKIT_AS_REGISTRATION_FILE: /calls/lk-jwt-registration.yaml
      LIVEKIT_HS_SERVER_NAME: messenger.internal
      LIVEKIT_CS_API_URL_OVERRIDES: messenger.internal=http://matrix:8008
      LIVEKIT_SANITY_CHECK_INTERVAL_SECONDS: "30"
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/data/calls:/calls:ro
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      unified-init:
        condition: service_completed_successfully
    networks:
      - call-lane
      - matrix-lane
    stop_grace_period: 10s
    restart: unless-stopped
  call-tunnel:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-6c185da6716e7e085ad3d2524b08753aa9ec665d@sha256:f7ce9b0c26b69f8f0d6e802c468a4df7a06bfb2e1fb60232210709f49eb6d880}
    user: 1000:1000
    entrypoint:
      - /bin/sh
      - -c
    command:
      - trap "kill $$p 2>/dev/null; exit 0" TERM INT; while :; do until [ -f /calls/enabled ] && [ -s /calls/tunnel-token ]; do sleep 2 & wait $$!; done; /usr/local/bin/cloudflared tunnel --no-autoupdate --metrics 127.0.0.1:0 run --token-file /calls/tunnel-token & p=$$!; while [ -f /calls/enabled ] && [ -s /calls/tunnel-token ] && kill -0 $$p 2>/dev/null; do sleep 2 & wait $$!; done; kill $$p 2>/dev/null; wait $$p; done
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    mem_limit: 128m
    pids_limit: 64
    volumes:
      - ${APP_DATA_DIR}/data/calls:/calls:ro
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      unified-init:
        condition: service_completed_successfully
    networks:
      - tunnel-lane
      - call-egress
    stop_grace_period: 10s
    restart: unless-stopped
    environment:
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
  telegram:
    image: ${TELEGRAM_IMAGE:-ghcr.io/humanitylabs-org/wizard-telegram-bridge:sha-ca3f781e94cefe315adb464b6a37d84933d2bdb3@sha256:a41232b2e3f2b9786d5978540ede2e5bcfcde7de3309fa8178ec257a1cb5dc4b}
    user: 1000:1000
    entrypoint:
      - /bin/sh
      - -c
    command:
      - while [ ! -f /data/configured ]; do sleep 2; done; exec /usr/bin/mautrix-telegram -c /data/config.yaml
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - ${APP_DATA_DIR}/data/telegram:/data
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    depends_on:
      unified-init:
        condition: service_completed_successfully
      matrix:
        condition: service_healthy
    networks:
      - matrix-lane
      - telegram-egress
    healthcheck:
      test:
        - CMD-SHELL
        - test ! -f /data/configured || wget -q -O /dev/null http://127.0.0.1:29317/_matrix/mau/live
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    environment:
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
  translation:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-6c185da6716e7e085ad3d2524b08753aa9ec665d@sha256:f7ce9b0c26b69f8f0d6e802c468a4df7a06bfb2e1fb60232210709f49eb6d880}
