services:
  hermes-frontend-3:
    image: ghcr.io/humanitylabs-org/hermes-frontend-3:1af684e-1
    user: 101:101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HERMES_BACKEND_URL: ${HERMES_BACKEND_URL}
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    x-runtipi:
      is_main: true
      internal_port: 8080
    volumes:
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    ports:
      - 127.0.0.1:${APP_PORT}:8080
x-runtipi:
  schema_version: 2
  overrides: []
