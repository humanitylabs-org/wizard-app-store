services:
  wizard-mail:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    pids_limit: 64
    user: 1000:1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=32m,uid=1000,gid=1000
    environment:
      PORT: "18818"
      APP_PORT: ${APP_PORT:-18818}
      BIND: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: "1"
      WIZARD_SHELL_AUTH: ${WIZARD_SHELL_AUTH:-tailscale-serve}
      WIZARD_OWNER_LOGINS: ${WIZARD_OWNER_LOGINS:-}
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      WIZARD_OWNER_TOKEN: ${WIZARD_OWNER_TOKEN:-}
      WIZARD_ADMIN_TOKEN: ${WIZARD_ADMIN_TOKEN:-}
      MAIL_SOURCES: ${MAIL_SOURCES:-google=http://wizard-google:18812,microsoft=http://wizard-microsoft:18814}
      MAIL_DATA: /data
      MAIL_AGENT_SERVICE: ${MAIL_AGENT_SERVICE:-http://wizard-agent-service:8787}
      MAIL_AGENT_INBOX_TOKEN: ${MAIL_AGENT_INBOX_TOKEN:-}
      MAIL_STORE_URL: http://wizard-mail-store:8080
      MAIL_STORE_SECRET_FILE: /data/store/secret
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    command:
      - python
      - -c
      - |
        import base64,json,pathlib,runpy,zlib
        root=pathlib.Path('/tmp/wizard-app');root.mkdir(exist_ok=True)
        files=json.loads(zlib.decompress(base64.b64decode('')))
        for name,text in files.items():
         p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
        runpy.run_path(str(root/'app/server.py'),run_name='__main__')
    x-runtipi:
      is_main: true
      internal_port: 18818
    init: true
    ports:
      - 127.0.0.1:${APP_PORT}:18818
  wizard-mail-store:
    image: stalwartlabs/stalwart:v1.1.1-alpine@sha256:53ce86ed60f3730a031b09721b9b83b80e062f2f2095ea0e9b343bdd4ff6cc2e
    pids_limit: 256
    user: 1000:1000
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/wizard-mail
      - ${APP_DATA_DIR}/wizard:/wizard:ro
      - ${APP_DATA_DIR}/wizard-requests:/wizard-requests
    entrypoint:
      - /bin/sh
      - -c
    command:
      - set -eu; S=/var/lib/wizard-mail/store; umask 077; mkdir -p "$$S/db"; if [ ! -s "$$S/secret" ]; then head -c 32 /dev/urandom | od -An -v -tx1 | tr -dc 0-9a-f > "$$S/.secret"; mv "$$S/.secret" "$$S/secret"; fi; printf '{"@type":"RocksDb","path":"%s/db/"}' "$$S" > "$$S/config.json"; STALWART_RECOVERY_ADMIN="admin:$$(cat "$$S/secret")"; export STALWART_RECOVERY_ADMIN; exec /usr/local/bin/stalwart --config "$$S/config.json"
    environment:
      WIZARD_GRANTS_FILE: /wizard/grants.json
      WIZARD_CONNECTION_REQUESTS: /wizard-requests/connections.json
x-runtipi:
  schema_version: 2
  overrides: []
