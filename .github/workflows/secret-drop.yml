name: Build Secret Drop relay
on:
  push:
    branches: [main]
    paths: ['images/secret-drop/**', 'apps/secret-drop/**', 'scripts/smoke-secret-drop.py', 'scripts/translate-video-recipe.mjs', '__tests__/secret-drop.test.ts', '.github/workflows/secret-drop.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  secret-drop-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test && npx tsc --noEmit
      - name: Vendored browser crypto rebuilds byte-for-byte from pinned packages
        working-directory: images/secret-drop/vendor
        run: npm ci --no-audit --no-fund && node build.mjs && git diff --exit-code -- ../static/noble-crypto.js
      - uses: astral-sh/setup-uv@v6
      - name: Relay and client unit tests (browser JS -> Python HPKE round trip)
        working-directory: images/secret-drop
        run: uv run --no-project --with cryptography==50.0.2 python -m unittest discover -s tests -v
      - name: Client works with the oldest documented cryptography (47.0.0, first with HPKE)
        working-directory: images/secret-drop
        run: uv run --no-project --with cryptography==47.0.0 python -m unittest discover -s tests
      - name: Build and test image (read-only, unprivileged, file allowlist)
        run: sh images/secret-drop/test-container.sh
      - name: Runtipi translation, fresh bind, insecure-context browser, client pickup, persistence
        shell: bash
        run: |
          uv run --no-project --with playwright==1.63.0 python -m playwright install --with-deps chromium
          SMOKE_OUTPUT="$RUNNER_TEMP/secret-drop-evidence" TMPDIR="$RUNNER_TEMP" \
            uv run --no-project --with playwright==1.63.0 --with cryptography==50.0.2 python scripts/smoke-secret-drop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-drop-verification
          path: ${{ runner.temp }}/secret-drop-evidence
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested relay (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: images/secret-drop
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/humanitylabs-org/secret-drop:0.1.1
      - name: Published image passes the same container test
        run: |
          docker pull ghcr.io/humanitylabs-org/secret-drop:0.1.1
          SKIP_BUILD=1 SECRET_DROP_IMAGE=ghcr.io/humanitylabs-org/secret-drop:0.1.1 sh images/secret-drop/test-container.sh
# Publishes only after store, bundle, unit, container and browser lifecycle checks pass.
