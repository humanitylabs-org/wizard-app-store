name: Build Tinfoil (AI connection app)
on:
  push:
    branches: [main]
    paths: ['images/wizard-tinfoil/**', '__tests__/tinfoil.test.ts', '.github/workflows/tinfoil.yml']
  pull_request:
    branches: [main]
    paths: ['images/wizard-tinfoil/**', '__tests__/tinfoil.test.ts', '.github/workflows/tinfoil.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  tinfoil:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test && npx tsc --noEmit
      - name: Build Tinfoil image
        run: docker build -t wizard-tinfoil:test images/wizard-tinfoil
      - name: Unit tests inside the image (local auth, guards, agent registration, official SDK fail-closed)
        run: docker run --rm --network none -v "$PWD/images/wizard-tinfoil":/qa:ro --entrypoint python wizard-tinfoil:test -m unittest discover -s /qa/tests -v
      - name: Read-only, uid 1000, no capabilities, logged-out contract
        run: |
          docker run -d --name tinfoil-smoke --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp -v tvol:/data -p 127.0.0.1:18804:18804 wizard-tinfoil:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18804/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:18804/api/connection | grep -q '"status": "not_connected"'
          test "$(docker exec tinfoil-smoke id -u)" = 1000
          docker rm -f tinfoil-smoke
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested Tinfoil (amd64 and arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/wizard-tinfoil
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/humanitylabs-org/wizard-tinfoil:0.2.2
      - name: Published image passes the same checks
        if: github.event_name != 'pull_request'
        run: |
          docker pull ghcr.io/humanitylabs-org/wizard-tinfoil:0.2.2
          docker run --rm --network none -v "$PWD/images/wizard-tinfoil":/qa:ro --entrypoint python ghcr.io/humanitylabs-org/wizard-tinfoil:0.2.2 -m unittest discover -s /qa/tests
          docker buildx imagetools inspect ghcr.io/humanitylabs-org/wizard-tinfoil:0.2.2 | grep -q linux/arm64
# Publishes only after store, unit and container checks pass. Never re-push 0.2.2: bump the tag.
