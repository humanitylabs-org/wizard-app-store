name: Build ChatGPT (AI connection app)
on:
  push:
    branches: [main]
    paths: ['images/wizard-chatgpt/**', '__tests__/chatgpt.test.ts', '.github/workflows/chatgpt.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  chatgpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test && npx tsc --noEmit
      - name: Device-code flow against a stand-in Hermes dashboard (no token, password or session id leaks)
        run: python3 -I images/wizard-chatgpt/test-chatgpt.py
      - name: Build and test ChatGPT image (contract with no dashboard, box-only, no credential surface)
        run: sh images/wizard-chatgpt/test-container.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested ChatGPT (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: images/wizard-chatgpt
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/humanitylabs-org/wizard-chatgpt:0.2.0
      - name: Published image passes the same checks
        run: |
          docker pull ghcr.io/humanitylabs-org/wizard-chatgpt:0.2.0
          SKIP_BUILD=1 WIZARD_CHATGPT_IMAGE=ghcr.io/humanitylabs-org/wizard-chatgpt:0.2.0 sh images/wizard-chatgpt/test-container.sh
          docker buildx imagetools inspect ghcr.io/humanitylabs-org/wizard-chatgpt:0.2.0 | grep -q linux/arm64
# Publishes only after store, unit and container checks pass. Never re-push 0.2.0: bump the tag.
