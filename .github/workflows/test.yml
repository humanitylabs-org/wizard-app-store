name: Validate store
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Official image startup, authentication, and persistence
        run: python3 scripts/smoke.py
      - name: Files app - Runtipi media folder permissions, starter folders, 300 MB tus upload/download, optional login
        run: python3 scripts/smoke-files.py
