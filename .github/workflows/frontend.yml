name: Build browser frontend
on:
  push:
    branches: [main]
    paths: ['images/hermes-frontend-3/**', 'scripts/prepare-frontend.sh', 'scripts/smoke-frontend.py', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  browser-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test && npx tsc --noEmit
      - name: Build unchanged upstream UI
        run: sh scripts/prepare-frontend.sh
      - name: Build test image
        run: docker build -t wizard-hermes-frontend-3:test images/hermes-frontend-3
      - uses: astral-sh/setup-uv@v6
      - name: Browser and separate authenticated backend smoke
        run: |
          uv run --with playwright python -m playwright install --with-deps chromium
          uv run --with playwright python scripts/smoke-frontend.py
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/frontend-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: ${{ runner.temp }}/frontend-evidence
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested static frontend (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: images/hermes-frontend-3
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/humanitylabs-org/hermes-frontend-3:1af684e-1
