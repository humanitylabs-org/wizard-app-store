name: Build Private Client
on:
  push:
    branches: [main]
    paths: ['images/wizard-private-client/**', '__tests__/private-client.test.ts', '.github/workflows/private-client.yml']
  pull_request:
    branches: [main]
    paths: ['images/wizard-private-client/**', '__tests__/private-client.test.ts', '.github/workflows/private-client.yml']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full source commit SHA (must equal selected ref)
        required: true
      version:
        description: Write-once release version
        required: true
        default: '0.1.0'
      confirm_version:
        description: Repeat release version to authorize publication
        required: true
permissions:
  contents: read
jobs:
  private-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: images/wizard-private-client/package-lock.json
      - name: Install pinned SDK and audit production dependencies
        working-directory: images/wizard-private-client
        run: npm ci --ignore-scripts && npm audit --omit=dev
      - name: Unit, real EHBP sealing and isolated container checks (no API key)
        working-directory: images/wizard-private-client
        run: python3 tests/run.py
  publish:
    needs: private-client
    if: >-
      github.repository == 'humanitylabs-org/wizard-app-store' &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/private-providers-client') &&
       inputs.expected_sha == github.sha && inputs.version == '0.1.0' && inputs.confirm_version == inputs.version)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Refuse existing release tags; reuse immutable source only on main
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 images/wizard-private-client/tests/release_guard.py
      - uses: docker/login-action@v3
        if: steps.existing.outputs.digest == ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested Private Client (amd64 and arm64)
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: images/wizard-private-client
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/humanitylabs-org/wizard-app-store
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/humanitylabs-org/wizard-private-client:0.1.0
            ghcr.io/humanitylabs-org/wizard-private-client:sha-${{ github.sha }}
  verify-public:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/humanitylabs-org/wizard-private-client
      DIGEST: ${{ needs.publish.outputs.digest }}
      DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - name: Anonymous multi-platform digest, revision and write-once tag verification
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 images/wizard-private-client/tests/verify_release.py
      - name: Verify published amd64 runtime under the same restrictions
        working-directory: images/wizard-private-client
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" pp-test-client:test
          docker build --target test -t pp-test-client:unit .
          docker build -f tests/Dockerfile.relay -t pp-test-client-relay:test .
          python3 tests/run.py --skip-build
          printf 'Published `%s@%s` from `%s`\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
# Never repush 0.1.0: bump the version and tag for any subsequent release.
