name: Build Claude (AI connection app)
on:
  push:
    branches: [main]
    paths: ['images/wizard-claude/**', '__tests__/claude.test.ts', 'tests/claude-pool-accounts.py', '.github/workflows/claude.yml']
  pull_request:
    branches: [main]
    paths: ['images/wizard-claude/**', '__tests__/claude.test.ts', 'tests/claude-pool-accounts.py', '.github/workflows/claude.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  claude:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test && npx tsc --noEmit
      - name: Any number of subscriptions, no-password owner changes, original sign-in page (loopback fixtures)
        run: python3 tests/claude-pool-accounts.py
      - name: Usage normalization against a stand-in Anthropic usage server (no token leaks, never refreshes)
        run: python3 -I images/wizard-claude/test-usage.py
      # Use the publisher's docker-container BuildKit driver for pre-publish smoke.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and test Claude image (pinned Claude Code, logged-out contract, login/test/logout paths, box-only, no token surface)
        run: sh images/wizard-claude/test-container.sh
      - name: Isolated inference contract tests (fake providers only)
        run: |
          python3 -I images/wizard-claude/test-inference.py -v
          WIZARD_TEST_POOL=1 python3 -I images/wizard-claude/test-inference.py -v
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an already published tag
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect ghcr.io/humanitylabs-org/wizard-claude:0.2.5 >/dev/null 2>&1; then
            echo "wizard-claude:0.2.5 is already published; bump the tag in this workflow and server.py" >&2; exit 1
          fi
      - name: Publish tested Claude (amd64 and arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/wizard-claude
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/humanitylabs-org/wizard-claude:0.2.5
      - name: Published image passes the same checks
        if: github.event_name != 'pull_request'
        run: |
          docker pull ghcr.io/humanitylabs-org/wizard-claude:0.2.5
          SKIP_BUILD=1 WIZARD_CLAUDE_IMAGE=ghcr.io/humanitylabs-org/wizard-claude:0.2.5 sh images/wizard-claude/test-container.sh
          docker buildx imagetools inspect ghcr.io/humanitylabs-org/wizard-claude:0.2.5 | grep -q linux/arm64
# Publishes only after store, unit and container checks pass. Never re-push 0.2.5: bump the tag.
