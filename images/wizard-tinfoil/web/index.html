<!doctype html>
<html lang="en" data-app="wizard-tinfoil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Tinfoil</title><script src="boot.js"></script><link rel="stylesheet" href="wizard-ui.css"><link rel="stylesheet" href="styles.css"><script defer src="theme-client.js"></script><script defer src="app.js"></script></head>
<body><div class="wz-app"><header class="wz-head"><h1>Tinfoil</h1></header><main class="wz-scroll"><section class="wz-sec"><div class="wz-row"><span class="wz-main"><b id="connection">…</b></span></div><form id="connect-form" autocomplete="off" hidden><input class="wz-input" id="api-key" name="api-key" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="16" maxlength="512" required placeholder="API key" aria-label="API key"><button class="action primary" id="connect" type="submit">Connect</button><a class="get-key" href="https://dash.tinfoil.sh" target="_blank" rel="noopener noreferrer">Get a key ↗</a></form><div class="actions" id="saved" hidden><button class="action" id="disconnect" type="button" disabled>Disconnect</button><button class="action small" id="test" type="button" disabled>Test</button></div></section><section class="wz-sec" id="billing-sec" hidden><h2 class="wz-sec-h">Billing</h2><div class="wz-row"><span class="wz-main"><b id="billing-line">…</b><small id="billing-sub"></small></span></div><form id="admin-form" autocomplete="off" hidden><p class="hint">Optional: lets Wizard show your Tinfoil credit on Home. Create an <b>admin key</b> on Tinfoil (Dashboard → Admin Keys), paste it here. It stays in this app and is only used to read billing.</p><input class="wz-input" id="admin-key" name="admin-key" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="16" maxlength="512" required placeholder="Admin key" aria-label="Admin key"><button class="action primary" id="admin-save" type="submit">Save billing key</button><a class="get-key" href="https://dash.tinfoil.sh" target="_blank" rel="noopener noreferrer">Create an admin key ↗</a></form><div class="actions" id="admin-saved" hidden><button class="action" id="admin-remove" type="button">Remove billing key</button></div></section></main><p id="status" class="wz-status" role="status" aria-live="polite"></p></div></body></html>
