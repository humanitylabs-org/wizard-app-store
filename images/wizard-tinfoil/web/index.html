<!doctype html>
<html lang="en" data-app="wizard-tinfoil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Tinfoil</title><script src="boot.js"></script><link rel="stylesheet" href="wizard-tokens.css"><link rel="stylesheet" href="wizard-ui.css"><link rel="stylesheet" href="wizard-layout.css"><link rel="stylesheet" href="styles.css"><script defer src="theme-client.js"></script><script defer src="wizard-sheet.js"></script><script defer src="app.js"></script><script src="/wizard-os-home/core/app-identity.js" defer></script></head>
<body><div class="wz-app"><header class="wz-head"><h1>Tinfoil</h1></header><main class="wz-scroll">
<div class="wz-conn"><span class="wz-tile sigil" aria-hidden="true"><svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#FFFFFF"/><g transform="translate(256 256) scale(1.2) translate(-256 -256)"><g transform="translate(87.534 92.679) scale(0.403216)"><path d="M825.24,610.01l-579.29,176.68L10.37,602.06,235.81,23.4l589.43,586.61ZM146.55,564.75l122.82,96.26,341.7-104.2L278.57,225.89l-132.02,338.86Z" fill="#004444" fill-rule="evenodd"/></g></g></svg></span>
<span class="wz-main"><b>Tinfoil</b><small>Your agent can use private models in verified enclaves.</small></span>
<span id="pill" class="wz-pill off">Not connected</span></div>
<section class="wz-sec"><h2 class="wz-sec-h">Accounts <span id="count" class="wz-count">0</span></h2>
<ul class="wz-list" id="keys">
<li class="key-row" data-row="api"><button class="wz-row" type="button" aria-haspopup="dialog" data-open="api"><span class="wz-tile" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg></span><span class="wz-main"><b data-state>API key</b><small data-sub></small></span><span class="use"></span><span class="wz-pill off" data-pill>Not added</span><span class="chev" aria-hidden="true">›</span></button></li>
<li class="key-row" data-row="admin"><button class="wz-row" type="button" aria-haspopup="dialog" data-open="admin"><span class="wz-tile" aria-hidden="true">$</span><span class="wz-main"><b data-state>Admin key</b><small data-sub></small></span><span class="use"><span class="wz-meter" id="credit" hidden><span data-credit></span><i><b></b></i></span></span><span class="wz-pill off" data-pill>Not added</span><span class="chev" aria-hidden="true">›</span></button>
<a class="get-key topup" id="topup" href="https://dash.tinfoil.sh/?tab=billing" target="_blank" rel="noopener noreferrer" hidden>Add credit on Tinfoil ↗</a></li>
</ul></section>
<div class="wz-actions"><button id="connect" class="wz-button" type="button" hidden>Connect</button></div>
<p id="status" class="wz-status" role="status" aria-live="polite"></p>
<details class="wz-more"><summary>Details</summary><dl id="details" class="facts"></dl></details>
</main></div>
<dialog class="wz-sheet key" id="k-api" aria-labelledby="k-api-h"><h2 id="k-api-h">API key <small>runs your private models</small></h2>
<div class="wz-row"><span class="wz-main"><b data-state>…</b><small data-sub></small></span></div>
<form data-form autocomplete="off" hidden><input class="wz-input" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="16" maxlength="512" required placeholder="Paste API key (tk_…)" aria-label="API key"><div class="actions"><button class="wz-button" type="submit">Save</button><button class="wz-button secondary" type="button" data-cancel hidden>Cancel</button><a class="get-key" href="https://dash.tinfoil.sh" target="_blank" rel="noopener noreferrer">Create one on Tinfoil ↗</a></div></form>
<div class="actions" data-saved hidden><button class="wz-button secondary" type="button" data-replace>Replace</button><button class="wz-button secondary" type="button" data-remove>Remove</button><button class="wz-button secondary" type="button" id="test">Test</button></div>
<p class="wz-status" data-msg role="status" aria-live="polite"></p></dialog>
<dialog class="wz-sheet key" id="k-admin" aria-labelledby="k-admin-h"><h2 id="k-admin-h">Admin key <small>reads billing only</small></h2>
<div class="wz-row"><span class="wz-main"><b data-state>…</b><small data-sub></small></span></div>
<form data-form autocomplete="off" hidden><input class="wz-input" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="16" maxlength="512" required placeholder="Paste admin key (admin_…)" aria-label="Admin key"><div class="actions"><button class="wz-button" type="submit">Save</button><button class="wz-button secondary" type="button" data-cancel hidden>Cancel</button><a class="get-key" href="https://dash.tinfoil.sh" target="_blank" rel="noopener noreferrer">Create one on Tinfoil (Admin Keys) ↗</a></div></form>
<div class="actions" data-saved hidden><button class="wz-button secondary" type="button" data-replace>Replace</button><button class="wz-button secondary" type="button" data-remove>Remove</button></div>
<p class="wz-status" data-msg role="status" aria-live="polite"></p></dialog>
</body></html>
