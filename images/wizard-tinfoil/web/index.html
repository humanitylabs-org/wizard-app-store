<!doctype html>
<html lang="en" data-app="wizard-tinfoil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Tinfoil</title><script src="boot.js"></script><link rel="stylesheet" href="wizard-ui.css"><link rel="stylesheet" href="styles.css"><script defer src="theme-client.js"></script><script defer src="app.js"></script></head>
<body><div class="wz-app"><header class="wz-head"><h1>Tinfoil</h1></header><main class="wz-scroll">
<section class="wz-sec key" id="k-api"><h2 class="wz-sec-h">API key <small>runs your private models</small></h2>
<div class="wz-row"><span class="wz-main"><b data-state>…</b><small data-sub></small></span></div>
<form data-form autocomplete="off" hidden><input class="wz-input" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="16" maxlength="512" required placeholder="Paste API key (tk_…)" aria-label="API key"><div class="actions"><button class="action primary" type="submit">Save</button><button class="action" type="button" data-cancel hidden>Cancel</button><a class="get-key" href="https://dash.tinfoil.sh" target="_blank" rel="noopener noreferrer">Create one on Tinfoil ↗</a></div></form>
<div class="actions" data-saved hidden><button class="action" type="button" data-replace>Replace</button><button class="action" type="button" data-remove>Remove</button><button class="action" type="button" id="test">Test</button></div></section>
<section class="wz-sec key" id="k-admin"><h2 class="wz-sec-h">Admin key <small>reads billing only</small></h2>
<div class="wz-row"><span class="wz-main"><b data-state>…</b><small data-sub></small></span></div>
<form data-form autocomplete="off" hidden><input class="wz-input" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" minlength="16" maxlength="512" required placeholder="Paste admin key (admin_…)" aria-label="Admin key"><div class="actions"><button class="action primary" type="submit">Save</button><button class="action" type="button" data-cancel hidden>Cancel</button><a class="get-key" href="https://dash.tinfoil.sh" target="_blank" rel="noopener noreferrer">Create one on Tinfoil (Admin Keys) ↗</a></div></form>
<div class="actions" data-saved hidden><button class="action" type="button" data-replace>Replace</button><button class="action" type="button" data-remove>Remove</button></div></section>
</main><p id="status" class="wz-status" role="status" aria-live="polite"></p></div></body></html>
